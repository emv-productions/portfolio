<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords"
        content="photography workshop, photography service, portfolio photography, the photographs, photography, lighting photography, photographer, kodak photos, family photos, white photos, digital photos, product photos, photo photos, corporate photos, photos with lights, artistic photos, minimalist photography, real estate photography, event photographers, event photographer, freelance photographer, aerial photography, advertising photography, professional photography, landscape photography, night photography, documentary photography, product photography, landscape photography, nature photography, corporate photography, artistic photography, color photography, advertising photography, professional photography, product photo, photoshop photo, panoramic photo, night photo, minimalist photo, photo europe, studio photo, business photo, documentary photo, digital photo, sky photo, portrait photo, studio photo, corporate photo, flash photo, photo studio, photo editing, photo direction, professional photo cameras, photo cameras, backlight photography, photo book, photo albums">
    <!-- Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>

    <!-- Título, referencias -->
    <title>EMV - Contact</title>
    <link rel="Shortcut Icon" type="image/x-icon" href="Multimedia/Master/icono.ico" />
    <script src="JS/header.js"></script>
    <script src="JS/footer.js"></script>
    <link href="CSS/contact.css" rel="stylesheet" />
    <link href="CSS/master.css" rel="stylesheet" />
    <script src="JS/master.js"></script>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
        rel="stylesheet">

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js">
    </script>

    <!-- Google Recaptcha -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Sweet Alert -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
    <div class="container">
        <div id="header"></div>
        <div id="contact_content">
            <div class="text-content">
                <h3>Contact me</h3>
                <p>"You are welcome to inquire about any information you may require regarding your ideas or projects."
                </p>
            </div>
            <div class="fields-content">
                <form id="contactForm">
                    <label>Name</label>
                    <input id="txtName" type="text" value="" placeholder="Name" autocapitalize="true"
                        autocomplete="false" aria-invalid="false">
                    <label>Last Name</label>
                    <input id="txtLastName" type="text" value="" placeholder="Last Name" autocapitalize="true"
                        autocomplete="false" aria-invalid="false">
                    <label>Email&nbsp;<span>(required)</span></label>
                    <input id="txtEmail" type="email" value="" placeholder="Email" autocapitalize="true"
                        autocomplete="false" aria-invalid="false" required>
                    <label>Message&nbsp;<span>(required)</span></label>
                    <textarea id="txtMessage" maxlength="400" autocapitalize="true" autocomplete="false"
                        aria-invalid="false" aria-required="true" value="" placeholder="Leave me your question..."
                        required></textarea>
                    <div class="btn-content">
                        <div id="captcha" class="g-recaptcha" data-sitekey="6Ld4QugqAAAAALoIS24qew-xJXHBaiVylMhFccbK" data-callback="enableBtn"></div>
                        <input type="submit" class="btn btn-dark" value="Send" OnClientClick="return validateRecaptcha();">
                    </div>
                </form>
            </div>
        </div>
        <div id="footer"></div>
    </div>
    <script src="JS/contact.js"></script>
</body>

</html>
