<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EMV - Home</title>
    <link rel="shortcut icon" type="image/x-icon" href="Multimedia/Master/icono.ico" />

    <!-- CSS propio -->
    <link href="CSS/master.css" rel="stylesheet" />
    <link href="CSS/index.css" rel="stylesheet" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap 5.3.3 JS (incluye Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS propio -->
    <script src="JS/master.js" defer></script>

<body>
    <div class="container">
        <div class="div-image">
            <div id="carouselPortada" class="carousel carousel-fade">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img id="img_1" class="d-block w-100" src="Multimedia/Index/Portada/1.jpg" alt="Portada" oncontextmenu="return false;">
                    </div>
                    <div class="carousel-item">
                        <img id="img_2" class="d-block w-100" src="Multimedia/Index/Portada/2.jpg" alt="Portada" oncontextmenu="return false;">
                    </div>
                    <div class="carousel-item">

                    </div>
                </div>
            </div>
        </div>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const carouselElement = document.querySelector('#carouselPortada');

                new bootstrap.Carousel(carouselElement, {
                    interval: 3000,
                    pause: false,
                    ride: 'carousel',
                    keyboard: false
                });
            });
        </script>

        <div class="content">
            <div class="logo">
                <img src="Multimedia/Index/Logos/logo.png" alt="Logo" oncontextmenu="return false;">
            </div>
            <div class="text">

                </div>
                <div class="subtitle">
                    <p>PHOTOGRAPHER & VIDEOGRAPHER</p>
                </div>
                <div class="div-btn">
                    <a class="btn btn-dark" href="collections.html">See more</a>
                </div>
            </div>
            <div class="contact">
                <a href="mailto:ezequiel.vieta@gmail.com" target="_blank"><img src="Multimedia/Index/Logos/email.png" alt="mail" oncontextmenu="return false;"></a>
                <a href="https://instagram.com/ezequielvieta?igshid=MzRlODBiNWFlZA==" target="_blank"><img src="Multimedia/Index/Logos/instagram.png" alt="instagram" oncontextmenu="return false;"></a>
                <a href="https://www.youtube.com/channel/UCi_cFUXozrRO66erzOTH7Uw" target="_blank"><img src="Multimedia/Index/Logos/youtube.png" alt="youtube" oncontextmenu="return false;"></a>
            </div>
        </div>
    </div>
</body>
</html>
